<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#F7EDE2">
    <title>発注ノート｜発注内容の確認</title>
    <link rel="stylesheet" href="./styles.css?v=7">
    <script type="module" src="./app.js?v=7"></script>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#list">発注ノート</a>
      <nav aria-label="メインメニュー">
        <a href="#list" data-page="list">発注リスト</a>
        <a href="#review" data-page="review">内容確認<span class="nav-count" id="nav-count" hidden>0</span></a>
        <a href="#manage" data-page="manage">商品管理</a>
      </nav>
    </header>
    <main id="main" tabindex="-1"></main>
    <input id="csv-file" type="file" accept=".csv,text/csv" aria-label="読み込むCSVファイル" hidden>
    <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <form method="dialog">
        <h2 id="dialog-title"></h2>
        <p id="dialog-message"></p>
        <textarea id="copy-fallback" aria-label="コピーする発注内容" readonly hidden></textarea>
        <div class="dialog-actions"><button value="cancel" class="secondary">戻る</button><button id="dialog-confirm" value="confirm" class="primary">続ける</button></div>
      </form>
    </dialog>
  </body>
</html>
